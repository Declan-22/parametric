[package]
name = "parametric"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
gpui = { git = "https://github.com/zed-industries/zed.git" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Stack-allocated gradient buffers for solver residuals (every equation
# touches ≤8 scalars — zero hot-loop heap allocation during drags).
smallvec = "1.15"
